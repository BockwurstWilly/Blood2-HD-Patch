# OpenAL Soft for Blood II (behind DSOAL's dsound.dll). Channels follow the Windows speaker setup.
# hrtf and stereo-mode are written by the HD Launcher (Sound -> Headphone 3D).
[general]
frequency = 48000
sample-type = float32
resampler = bsinc24
output-limiter = true
hrtf = auto
stereo-mode = auto

[eax]
enable = true
